name: build-apk
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install SDK packages
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-34" "build-tools;34.0.0"
      - name: Build
        working-directory: launcher
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain
      - name: Sign if needed
        run: |
          APK=$(find launcher/app/build/outputs/apk/release -name '*.apk' | head -n1)
          [ -n "$APK" ] || { echo "No APK found"; exit 1; }
          echo "Found $APK"
          mkdir -p out
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n1)
          if echo "$APK" | grep -qi unsigned; then
            keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=glass-tv"
            $BT/zipalign -f -p 4 "$APK" aligned.apk
            $BT/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out out/glass-tv.apk aligned.apk
          else
            cp "$APK" out/glass-tv.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: glass-tv-apk
          path: out/glass-tv.apk
